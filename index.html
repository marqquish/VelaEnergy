<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vela Energy – Instalador Eléctrico Autorizado en Madrid</title>

<!-- SEO -->
<meta name="description" content="Instalador eléctrico autorizado en Madrid. Urgencias 24h, boletines eléctricos, cuadros eléctricos, reformas y cargadores VE. Servicio rápido y profesional.">
<meta name="keywords" content="electricista Madrid, instalador eléctrico, boletines eléctricos, CIE, averías eléctricas, cargadores coche eléctrico, fotovoltaica Madrid">
<meta name="robots" content="index, follow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #e02020;
    --dark-red: #c01818;
    --navy: #0a1628;
    --navy-light: #112240;
    --white: #ffffff;
    --gray-light: #f5f5f5;
    --gray: #888;
    --green: #00c853;
    --text: #222;
    --text-muted: #555;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Open Sans', sans-serif; color: var(--text); }
  a { text-decoration: none; color: inherit; }

  html { scroll-behavior: smooth; }

  /* ANIMATIONS */
  .reveal {
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.8s ease;
  }
  .reveal.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 40px;
    background: rgba(255,255,255,0.97);
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  .nav-logo {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 18px;
  }

  .nav-logo-img { width: 28px; height: 28px; object-fit: contain; }

  .nav-links { display: flex; gap: 28px; font-size: 13.5px; font-weight: 500; }

  .nav-cta {
    background: var(--green); color: white; padding: 9px 20px;
    border-radius: 6px; font-weight: 700; font-size: 13px;
    font-family: 'Montserrat', sans-serif;
  }

  /* HERO */
  .hero {
    padding-top: 68px; min-height: 100vh;
    background: #f8f8f8;
    display: grid; grid-template-columns: 1fr 1fr;
    align-items: center;
  }

  .hero-left { padding: 80px 40px 80px 80px; }

  .hero-right {
    height: 100vh;
    position: relative;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-img {
    width: 75%;
    height: auto;
    object-fit: cover;
    opacity: 0.9;
    border-radius: 18px;
    position: relative;
    z-index: 2;
    box-shadow: 0 10px 35px rgba(0,0,0,0.35);
  }

  /* TESTIMONIO */
  .testimonio {
    background: #ffffff;
    padding: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .testi-inner blockquote {
    font-size: 20px;
    font-style: italic;
    color: #222;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .testi-info h4 { color: #222; }
  .testi-info p { color: #555; }

</style>
</head>

<body>

<nav class="reveal">
  <div class="nav-logo">
    <img src="logo.png" class="nav-logo-img">
    <span>Vela Energy</span>
  </div>
  <div class="nav-links">
    <a href="#inicio">Inicio</a>
    <a href="#servicios">Servicios Principales</a>
    <a href="#especialista">Especialista</a>
    <a href="#proceso">Proceso</a>
    <a href="#testimonio">Testimonio</a>
  </div>
  <a href="tel:742031496" class="nav-cta">Llamar Ahora</a>
</nav>

<section class="hero" id="inicio">
  <div class="hero-left reveal">
    <h1>Instalador Eléctrico Autorizado en Madrid</h1>
    <p>Soluciones eléctricas rápidas, sin complicaciones.</p>
  </div>

  <div class="hero-right reveal">
    <img src="furgoneta.png" class="hero-img">
  </div>
</section>

<section class="testimonio reveal" id="testimonio">
  <div class="testi-inner">
    <blockquote>
      "Servicio profesional y transparente."
    </blockquote>
    <div class="testi-info">
      <h4>Samuel Martín Vela</h4>
      <p>CEO</p>
    </div>
  </div>
</section>

<script>
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('show');
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>

</body>
</html>
